# Weekly upkeep: broken links, domains that started redirecting elsewhere (possible
# hijack or sale), entries not verified recently, and inactive source repositories.
# Each report lives in one tracking issue that is updated and closed when clean.
name: Maintenance

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  report:
    name: ${{ matrix.report }} report
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # create, update, and close the tracking issue
    strategy:
      fail-fast: false
      matrix:
        report: [links, stale]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r scripts/requirements.txt

      - name: Build report
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ matrix.report }}
        run: python scripts/maintenance.py "$REPORT" --issue
