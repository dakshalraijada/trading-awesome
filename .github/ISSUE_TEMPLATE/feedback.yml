name: Suggest an improvement
description: Ideas for the guides, sections, comparisons, or the way the list works.
title: "[Idea]: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        To add or change a single entry, use the **Add a service** or **Update an entry** forms instead.
  - type: textarea
    id: idea
    attributes:
      label: Suggestion
      description: What should change and why.
    validations:
      required: true
